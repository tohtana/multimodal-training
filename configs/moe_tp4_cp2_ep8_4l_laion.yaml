# MoE config with heterogeneous parallelism (4-layer smoke test):
# - Vision: TP=4, CP=2 (8 GPUs via TP×CP)
# - Text: TP=14 CP=2 (attention), EP=8 (MoE) with MoE Parallel Folding

debug: false

vision:
  model_type: "qwen3_moe_vl"
  model_name: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  engine: "megatron"
  parallelism: "tensor"
  dtype: "bfloat16"
  attention_backend: "auto"
  activation_checkpointing: true
  autocast: true
  engine_config:
    tensor_parallel_size: 4   # TP=4 for vision encoder
    pipeline_model_parallel_size: 1
    sequence_parallel_size: 2  # CP=2 for vision encoder
    expert_model_parallel_size: 1
    attention_backend: "auto"
    megatron_num_layers: 4  # 4-layer model for faster smoke test
    load_weights: true
    use_cpu_initialization: true
    bridge_load_path: "/mnt/local_storage/checkpoints/qwen3_vl_30b_a3b_4l_split"

text:
  model_type: "qwen3_moe_vl"
  model_name: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  engine: "megatron"
  parallelism: "tensor"
  dtype: "bfloat16"
  attention_backend: "auto"
  activation_checkpointing: true
  autocast: true
  engine_config:
    tensor_parallel_size: 4   # TP=1 for text decoder (MoE Parallel Folding)
    pipeline_model_parallel_size: 1
    sequence_parallel_size: 2  # CP=2 for attention
    expert_model_parallel_size: 8  # EP=8 for MoE/FF (folded with CP)
    attention_backend: "auto"
    megatron_num_layers: 4  # 4-layer model for faster smoke test
    load_weights: true
    use_cpu_initialization: true
    bridge_load_path: "/mnt/local_storage/checkpoints/qwen3_vl_30b_a3b_4l_split"

training:
  batch_size: 1
  learning_rate: 5e-05
  num_epochs: 1
  num_iterations: 2
  warmup_steps: 0
  warmup_ratio: 0.0
  lr_scheduler_type: "constant"
  weight_decay: 0.0
  gradient_accumulation_steps: 1
  seed: 42
  parallel_size: 8  # Vision: TP=4 × CP=2 = 8, Text: max(CP=8, EP=8) = 8
  dp_size: 1
  collocate: true  # Vision and text share the same 8 GPUs
  clip_grad_norm: false
  max_grad_norm: 1.0
  no_checkpoint: false
  checkpoint_dir: "/mnt/local_storage/checkpoints/qwen3_vl_30b_a3b_moe_tp4_cp2_ep8_laion"
  log_interval: 1

data:
  datasets:
    - laion_pop_train
  data_registry:
    laion_pop_train:
      annotation_path: "/mnt/local_storage/laion/laion_pop_train.jsonl"
      data_path: "/mnt/local_storage/laion/images"
  num_workers: 2
  pin_memory: true
  data_flatten: true
  min_pixels: 802816
  max_pixels: 802816
  force_fixed_size: true

deepspeed:
  reduce_bucket_size: 100000000
