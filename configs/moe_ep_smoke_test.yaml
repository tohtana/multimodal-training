debug: false

vision:
  model_type: "qwen3_moe_vl"
  model_name: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  engine: "megatron"
  parallelism: "tensor"
  dtype: "bfloat16"
  attention_backend: "auto"
  activation_checkpointing: false
  autocast: true
  engine_config:
    tensor_parallel_size: 1
    pipeline_model_parallel_size: 1
    sequence_parallel_size: 1
    expert_model_parallel_size: 8
    attention_backend: "auto"
    megatron_num_layers: 4  # Use 4-layer model for faster smoke test
    load_weights: true
    use_cpu_initialization: true
    bridge_load_path: "/mnt/local_storage/checkpoints/qwen3_vl_30b_a3b_4l_split"

text:
  model_type: "qwen3_moe_vl"
  model_name: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  engine: "megatron"
  parallelism: "tensor"
  dtype: "bfloat16"
  attention_backend: "auto"
  activation_checkpointing: false
  autocast: true
  engine_config:
    tensor_parallel_size: 1
    pipeline_model_parallel_size: 1
    sequence_parallel_size: 1
    expert_model_parallel_size: 8
    attention_backend: "auto"
    megatron_num_layers: 4  # Use 4-layer model for faster smoke test
    load_weights: true
    use_cpu_initialization: true
    bridge_load_path: "/mnt/local_storage/checkpoints/qwen3_vl_30b_a3b_4l_split"

training:
  batch_size: 1
  learning_rate: 5e-05
  num_epochs: 1
  num_iterations: 2
  warmup_steps: 0
  warmup_ratio: 0.0
  lr_scheduler_type: "constant"
  weight_decay: 0.0
  gradient_accumulation_steps: 1
  seed: 42
  parallel_size: 8
  dp_size: 1
  collocate: true  # Must be true: EP=8 requires 8 actors, and with 8 GPUs we must share
  clip_grad_norm: false
  max_grad_norm: 1.0
  no_checkpoint: false
  checkpoint_dir: "/mnt/local_storage/checkpoints/qwen3_vl_30b_a3b_moe_ep_smoke"
  log_interval: 1

data:
  datasets:
    - mscoco2017_train_captions
  data_registry:
    mscoco2017_train_captions:
      annotation_path: "/mnt/local_storage/mscoco2017/annotations/coco2017_train_qwen.json"
      data_path: "/mnt/local_storage/mscoco2017"
  num_workers: 2
  pin_memory: true
  data_flatten: true
  min_pixels: 802816
  max_pixels: 802816
  force_fixed_size: false

deepspeed:
  reduce_bucket_size: 100000000
