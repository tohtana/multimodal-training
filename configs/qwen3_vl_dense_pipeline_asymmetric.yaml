debug: false

pipeline:
  stages:
    - name: vision
      component_type: vision
      is_source: true
      is_terminal: false
    - name: text
      component_type: text
      is_source: false
      is_terminal: true
  edges:
    - src: vision
      dst: text
  resource_sets:
    - name: vision_gpus
      num_gpus: 2
      device_ids: [0, 1]
    - name: text_gpus
      num_gpus: 4
      device_ids: [2, 3, 4, 5]
  placements:
    - stage: vision
      resource_set: vision_gpus
    - stage: text
      resource_set: text_gpus

vision:
  model_type: "qwen3_vl"
  model_name: "Qwen/Qwen3-VL-8B-Instruct"
  engine: "megatron"
  parallelism: "tensor"
  dtype: "bfloat16"
  attention_backend: "flash_attention_2"
  activation_checkpointing: true
  autocast: true
  engine_config:
    tensor_parallel_size: 2
    pipeline_model_parallel_size: 1
    sequence_parallel_size: 1
    attention_backend: "unfused"
    load_weights: true

text:
  model_type: "qwen3_vl"
  model_name: "Qwen/Qwen3-VL-8B-Instruct"
  engine: "megatron"
  parallelism: "tensor"
  dtype: "bfloat16"
  attention_backend: "flash_attention_2"
  activation_checkpointing: true
  autocast: true
  text_seq_len: 8
  engine_config:
    tensor_parallel_size: 4
    pipeline_model_parallel_size: 1
    sequence_parallel_size: 1
    attention_backend: "unfused"
    load_weights: true
    optimizer_probe_bridge_loss_scale: 0.001

training:
  batch_size: 1
  learning_rate: 5e-05
  num_epochs: 1
  num_iterations: 3
  warmup_steps: 0
  warmup_ratio: 0.0
  lr_scheduler_type: "constant"
  weight_decay: 0.0
  gradient_accumulation_steps: 1
  seed: 42
  parallel_size: 4
  dp_size: 1
  collocate: false
  clip_grad_norm: false
  max_grad_norm: 1.0
  no_checkpoint: true
  checkpoint_dir: "/mnt/user_storage/checkpoints/qwen3_vl_dense_pipeline"
  log_interval: 1

data:
  datasets: []
  data_registry: {}
  num_workers: 0
  pin_memory: false
  data_flatten: true
  min_pixels: 802816
  max_pixels: 802816
  force_fixed_size: false

deepspeed:
  reduce_bucket_size: 100000000
